name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint and type check
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Dependency audit
        run: npm run audit:ci

      - name: Production build
        run: npm run build
